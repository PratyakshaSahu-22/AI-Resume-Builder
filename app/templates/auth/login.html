{% extends "base.html" %}
{% block title %}Login – AI Resume Builder{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-box-arrow-in-right fs-1 text-primary"></i>
          <h3 class="fw-bold mt-2">Welcome Back</h3>
          <p class="text-secondary small">Log in to your AI Resume Builder account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control"
                     placeholder="you@example.com" value="{{ email or '' }}" required/>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="pwField" class="form-control"
                     placeholder="Your password" required/>
              <button class="btn btn-outline-secondary" type="button" id="togglePw">
                <i class="bi bi-eye" id="pwEyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
          </button>
        </form>
        <hr class="my-4"/>
        <p class="text-center text-secondary small mb-0">
          Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-primary fw-semibold">Sign Up Free</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('togglePw').addEventListener('click', function() {
  const pw = document.getElementById('pwField');
  const icon = document.getElementById('pwEyeIcon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    pw.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
});
</script>
{% endblock %}
