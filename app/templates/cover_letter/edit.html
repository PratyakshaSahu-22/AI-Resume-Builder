{% extends "base.html" %}
{% block title %}Edit Cover Letter – AI Resume Builder{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square text-success me-2"></i>Edit Cover Letter</h4>
  <a href="{{ url_for('cover_letter.index') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form method="POST" action="{{ url_for('cover_letter.edit', letter_id=letter.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Company Name</label>
          <input type="text" name="company_name" class="form-control"
                 value="{{ letter.company_name or '' }}" maxlength="200"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Job Role</label>
          <input type="text" name="job_role" class="form-control"
                 value="{{ letter.job_role or '' }}" maxlength="200"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Cover Letter Content</label>
        <textarea name="content" class="form-control" rows="20" style="font-family: monospace; font-size:13px;">{{ letter.content or '' }}</textarea>
        <div class="form-text"><i class="bi bi-info-circle me-1"></i>Edit freely — the letter is yours.</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success fw-semibold"><i class="bi bi-save me-2"></i>Save Changes</button>
        <a href="{{ url_for('cover_letter.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
