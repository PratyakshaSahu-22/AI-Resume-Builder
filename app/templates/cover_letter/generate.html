{% extends "base.html" %}
{% block title %}Generate Cover Letter – AI Resume Builder{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="text-center mb-4">
      <i class="bi bi-envelope-open-text fs-1 text-success"></i>
      <h3 class="fw-bold mt-2">Generate Cover Letter</h3>
      <p class="text-secondary">Tell us the company and role — our AI will write a personalised letter using your profile.</p>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('cover_letter.generate') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-3">
            <label class="form-label fw-semibold">Company Name *</label>
            <input type="text" name="company_name" class="form-control" required
                   placeholder="Google, Microsoft, a Startup..." maxlength="200"/>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Job Role *</label>
            <input type="text" name="job_role" class="form-control" required
                   placeholder="Software Engineer, Data Analyst, ML Intern..." maxlength="200"/>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg fw-semibold">
              <i class="bi bi-stars me-2"></i>Generate Cover Letter
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
